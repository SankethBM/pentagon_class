<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Locate</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      ::selection {
        background-color: gold;
        color: black;
      }

      body {
        background-color: #f5f5f5;
      }

      nav {
        background-color: gold;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 50px;
        border-radius: 0 0 20px 20px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo img {
        width: 60px;
        height: 60px;
      }

      .logo h2 {
        color: black;
      }

      .nav-links {
        display: flex;
        gap: 30px;
      }

      .nav-links a {
        text-decoration: none;
        color: black;
        font-size: 18px;
        font-weight: bold;
      }

      .nav-links a:hover {
        color: white;
      }

      .main {
        margin-top: 50px;
        display: flex;
        justify-content: space-evenly;
      }

      .c1,
      .c2,
      .c3 {
        height: 500px;
        width: 500px;
        background-color: white;
        border-radius: 20px;
        box-shadow: 0 0 10px lightgray;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 15px;
        border: 2px solid black;
      }

      .i1,
      .i2,
      .i3 {
        height: 220px;
      }

      input {
        width: 250px;
        height: 40px;
        padding-left: 10px;
        border: 1px solid black;
        border-radius: 12px;
        text-align: center;
        font-weight: bolder;
      }

      button {
        height: 45px;
        width: 250px;
        border: none;
        background-color: black;
        color: white;
        font-weight: bold;
        border-radius: 12px;
        cursor: pointer;
      }

      button:hover {
        background-color: gold;
        color: black;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">
        <img src="./Location.gif" alt="Logo" />
        <h2>Local Locate</h2>
      </div>

      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact Us</a>
        <a href="#">Login</a>
      </div>
    </nav>

    <div class="main">
      <div class="c1">
        <img class="i1" src="Mobile Development.gif" alt="" />
        <h3>Mobile Service</h3>
        <input type="text" placeholder="Enter KM" />
        <button>Book Now</button>
      </div>

      <div class="c2">
        <img class="i2" src="Online Shopping.gif" alt="" />
        <h3>Home Service</h3>
        <input type="text" placeholder="Enter KM" />
        <button>Book Now</button>
      </div>

      <div class="c3">
        <img class="i3" src="Cloud.gif" alt="" />
        <h3>Cloud Service</h3>
        <input type="text" placeholder="Enter KM" />
        <button>Book Now</button>
      </div>
    </div>
  </body>
</html>
