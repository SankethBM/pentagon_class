<!doctype html>
<html>
  <head>
    <title>Gradient Examples</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
      }

      .box {
        width: 300px;
        height: 150px;
        margin: 10px auto;
        border: 2px solid black;
        color: white;
      }

      .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .container h2 {
        grid-column: 1 / -1;
      }

      .l1 {
        background: linear-gradient(yellow, red);
      }

      .l2 {
        background: linear-gradient(to right, blue, cyan);
      }

      .l3 {
        background: linear-gradient(45deg, purple, pink);
      }

      .r1 {
        background: radial-gradient(red, yellow);
      }

      .r2 {
        background: radial-gradient(blue, white);
        color: black;
      }

      .r3 {
        background: radial-gradient(purple, pink);
      }

      .c1 {
        background: conic-gradient(red, yellow, green, blue, red);
      }

      .c2 {
        background: conic-gradient(pink, purple, pink);
      }

      .c3 {
        background: conic-gradient(orange, white, green, orange);
      }
    </style>
  </head>
  <body>    
    <div class="">
      <h1>Gradient Examples</h1>

      <div class="container">
        <h2>Linear Gradients</h2>
        <div class="box l1"></div>
        <div class="box l2"></div>
        <div class="box l3"></div>

        <h2>Radial Gradients</h2>
        <div class="box r1"></div>
        <div class="box r2"></div>
        <div class="box r3"></div>

        <h2>Conic Gradients</h2>
        <div class="box c1"></div>
        <div class="box c2"></div>
        <div class="box c3"></div>
      </div>
    </div>
  </body>
</html>
