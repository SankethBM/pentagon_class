<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

.parent{
    height:100vh;
    background:linear-gradient(135deg,#f76868f3,#4facfe);
    display:flex;
    justify-content:space-evenly;
    align-items:center;
}

img{
    padding:20px;
    height:400px;
    width:350px;
    border-radius:20px;
    transition:all 0.5s ease;
}

img:hover{
    transform:translateY(-30px) scale(1.08);
    cursor:pointer;
}

.child2 img{
    animation: rotateY360 4s linear infinite;
}

@keyframes rotateY360{
    from{
        transform: rotateY(0deg);
    }
    to{
        transform: rotateY(360deg);
    }
}
</style>

</head>
<body>

<div class="parent">
    <div class="child1">
        <img src="i1-removebg-preview.png" alt="">
    </div>

    <div class="child2">
        <img src="i2-removebg-preview.png" alt="">
    </div>

    <div class="child3">
        <img src="i3-removebg-preview.png" alt="">
    </div>
</div>

</body>
</html>
